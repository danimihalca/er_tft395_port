CONFIG_LOG=y
CONFIG_SPI=y
CONFIG_GPIO=y

# Upstream LT7680 driver: PLL/SDRAM/panel timing/blanking/blit (display API)
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
# one SPI transaction per pixel burst instead of polling the FIFO per byte
CONFIG_LT7680_TRANSMIT_DATA_AS_BURST=y

CONFIG_MAIN_STACK_SIZE=4096
